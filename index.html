<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tug of War — Math Arena V2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="lobby" class="screen active"><div class="brand"><span>🪢</span><div><h1>TUG OF WAR</h1><b>MATH ARENA</b></div></div><p class="tag">Réfléchis. Réponds. Tire. Gagne.</p><div class="card"><label>Pseudo</label><input id="pseudo" maxlength="16" placeholder="Ex : Rio"><div class="grid"><button id="createBtn" class="blue">⚔️ CRÉER UNE PARTIE</button><button id="showJoin" class="red">🔑 REJOINDRE</button></div><div id="joinBox" class="hidden"><label>Code de salle</label><div class="row"><input id="code" maxlength="6" placeholder="ABC123"><button id="joinBtn">REJOINDRE</button></div></div><div id="status" class="status">Connexion Firebase…</div></div></section>
<section id="waiting" class="screen"><button id="leave" class="back">← Quitter</button><div class="card center"><small>CODE D'INVITATION</small><div id="bigCode" class="code">------</div><button id="copy">📋 Copier</button><div class="players"><div>🔵 <b id="p1">En attente…</b></div><strong>VS</strong><div>🔴 <b id="p2">En attente…</b></div></div><p id="waitText">Partage le code à ton adversaire.</p><button id="start" class="green hidden">🚀 LANCER LE DUEL</button></div></section>
<section id="game" class="screen"><div class="scores"><div>🔵 <b id="blueName">BLEU</b><strong id="bs">0</strong></div><div class="timer">⏱️ <b id="time">15</b></div><div>🔴 <strong id="rs">0</strong><b id="redName">ROUGE</b></div></div><div class="arena"><div class="rope" id="rope"><span>🏳️</span></div><i>🏃</i><em>🏃</em></div><div class="card q"><div id="level">🟢 FACILE</div><h2 id="question">—</h2><div id="answers" class="answers"></div><p id="feedback"></p></div></section>
<section id="result" class="screen"><div class="card center"><div class="win">🏆</div><h2 id="resultTitle">VICTOIRE !</h2><p id="resultText"></p><div class="final"><b>🔵 <span id="fb">0</span></b><span>—</span><b><span id="fr">0</span> 🔴</b></div><div id="stats" class="stats"></div><div class="grid"><button id="again" class="green">🔄 REJOUER</button><button id="home" class="dark">🏠 ACCUEIL</button></div></div></section></main><div id="toast" class="toast"></div><script type="module" src="script.js"></script></body></html>
